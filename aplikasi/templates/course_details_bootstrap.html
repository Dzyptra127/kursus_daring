<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Kursus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <h1 class="text-center text-primary mb-4">Daftar Kursus Tersedia</h1>

    {% for course in daftar_kursus %}
    <div class="card mb-4 shadow-sm">
        <div class="card-header bg-primary text-white">
            <h4 class="mb-0">{{ course.nama }}</h4>
        </div>
        <div class="card-body">
            <h5 class="card-title">Daftar Pelajaran</h5>
            <div class="list-group">
                {% for lesson in course.lessons.all %}
                <a href="{% url 'mulai_ujian' lesson.id %}" class="list-group-item list-group-item-action">
                    {{ lesson.judul }}
                    <span class="badge bg-secondary float-end">{{ lesson.daftar_pertanyaan.count }} Soal</span>
                </a>
                {% empty %}
                <p class="text-muted">Belum ada pelajaran.</p>
                {% endfor %}
            </div>
        </div>
    </div>
    {% endfor %}
</div>
</body>
</html>
